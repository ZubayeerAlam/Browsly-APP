# Local development settings for the Supabase CLI.
project_id = "browsly"

[db]
major_version = 17

[db.seed]
enabled = true
# seed_dev.sql adds demo sellers and products. It must never reach production:
# apply only seed.sql there, and never use `supabase db push --include-seed`.
sql_paths = ["./seed.sql", "./seed_dev.sql"]

# Log analytics isn't needed for local development.
[analytics]
enabled = false

# Demo photos for seed_dev.sql, uploaded locally.
[storage.buckets.product-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png"]
objects_path = "./seed_images"

[auth]
site_url = "com.browsly.app://login-callback"
additional_redirect_urls = ["com.browsly.app://login-callback"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "1m"

# Limits that protect against OTP abuse and SMS costs.
[auth.rate_limit]
email_sent = 30
sms_sent = 30
token_verifications = 30
sign_in_sign_ups = 30

[auth.sms]
enabled = true
enable_confirmations = true
template = "Your Browsly code is {{ .Code }}"
max_frequency = "1m"

# Test numbers receive this fixed code, and no real SMS is sent.
# Local development only: these must never be used in production.
[auth.sms.test_otp]
8801700000000 = "123456"
8801700000001 = "123456"

# Supabase needs an SMS provider switched on to accept phone sign-in. These
# placeholder values never send anything, because only test numbers are used
# locally. The real Bangladesh provider is connected before launch.
[auth.sms.twilio]
enabled = true
account_sid = "local-placeholder"
message_service_sid = "local-placeholder"
auth_token = "local-placeholder"

# Google sign-in. The values come from supabase/.env, which git ignores.
# See supabase/.env.example.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"

[functions.delete-account]
verify_jwt = true
